<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>DeepState ET Dashboard</title>
  <meta name="theme-color" content="#0f1115">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-name">DeepState ET <span class="muted">· Dashboard</span></span>
    </div>
    <div class="topbar-meta">
      <a href="./" target="_blank" rel="noopener" class="topbar-link">View site ↗</a>
      <button id="logout" class="topbar-link link-btn" hidden>Log out</button>
    </div>
  </header>

  <!-- Login -->
  <main id="login-view" class="login-view">
    <form id="login-form" class="card login-card">
      <h1>Dashboard</h1>
      <p class="muted">Publish news and events to the map.</p>
      <label class="field">
        <span>Password</span>
        <input id="password" type="password" autocomplete="current-password" required>
      </label>
      <label class="check">
        <input id="remember" type="checkbox">
        <span>Stay logged in on this device</span>
      </label>
      <button class="btn primary" type="submit">Log in</button>
      <p id="login-error" class="form-error" role="alert" hidden></p>
      <p id="setup-hint" class="muted small" hidden></p>
    </form>
  </main>

  <!-- Dashboard -->
  <main id="dash-view" class="dash" hidden>
    <section class="dash-panel">
      <form id="post-form" class="post-form">
        <h1 class="form-title">New post</h1>

        <fieldset class="field">
          <legend>What kind of post?</legend>
          <div id="type-grid" class="type-grid" role="radiogroup"></div>
        </fieldset>

        <label class="field">
          <span>What happened?</span>
          <textarea id="p-text" rows="4" maxlength="1500" required placeholder="e.g. TPLF has taken control of the main airport in Mekele."></textarea>
        </label>

        <div class="field">
          <span>Where? <span class="muted" id="loc-note">(optional for news: click the map)</span></span>
          <div class="loc-row">
            <input id="p-loc" type="text" placeholder="Click the map, or type lat, lng" autocomplete="off">
            <button type="button" class="btn ghost" id="clear-loc">Clear</button>
          </div>
        </div>

        <div class="field-row">
          <label class="field">
            <span>When?</span>
            <input id="p-date" type="datetime-local" required>
          </label>
          <label class="field">
            <span>Source link <span class="muted">(optional)</span></span>
            <input id="p-source" type="url" maxlength="500" placeholder="https://…">
          </label>
        </div>

        <button class="btn primary big" type="submit">Publish</button>
      </form>

      <section class="posts">
        <div class="posts-head">
          <h2>Your posts</h2>
          <button type="button" class="btn ghost small" id="refresh">Refresh</button>
        </div>
        <ul id="post-list" class="post-list"></ul>
      </section>
    </section>

    <section class="dash-map">
      <div class="map-search">
        <input id="town-search" type="search" placeholder="Jump to a town…" autocomplete="off" aria-label="Jump to a town">
        <ul id="town-results" class="search-results" hidden></ul>
      </div>
      <div id="admin-map" aria-label="Map for choosing a location"></div>
      <p class="map-hint">Click the map to set where it happened</p>
    </section>
  </main>

  <div id="toast" class="toast admin-toast" hidden></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/events.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
