name: Sync map

# Downloads the Google My Maps layers into data/layers/ and commits them.
# GitHub Pages ("Deploy from a branch") then publishes the updated site.
# Uses only shell commands, so it works even when third-party actions are disabled.

on:
  push:
  schedule:
    - cron: '*/30 * * * *'   # pull the latest Google My Maps data every 30 minutes
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-map
  cancel-in-progress: false

jobs:
  sync:
    # Only the branch GitHub Pages publishes (the default branch) keeps synced data.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: Check out
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git fetch -q --depth 1 origin "$BRANCH"
          git checkout -q -B "$BRANCH" FETCH_HEAD
      - name: Download map from Google My Maps
        run: node scripts/sync-map.mjs
      - name: Build RSS feed
        run: node scripts/build-feed.mjs
      - name: Post to Telegram
        # Optional: add TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID as repository secrets to enable.
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/notify-telegram.mjs
      - name: Commit changes
        id: commit
        run: |
          if [ -z "$(git status --porcelain data feed.xml)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data feed.xml
          git commit -q -m "Sync map data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push -q origin "HEAD:$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Rebuild GitHub Pages
        # Pushes made by this workflow don't always start a Pages build, so request one.
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: gh api -X POST "repos/${REPO}/pages/builds" --silent && echo "Pages build requested."
