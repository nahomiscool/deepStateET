name: Sync & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'   # pull the latest Google My Maps data every 30 minutes
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-and-deploy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download map from Google My Maps
        # A failed download still deploys the site with the last synced data.
        continue-on-error: true
        run: node scripts/sync-map.mjs
      - name: Commit changes
        id: commit
        run: |
          echo "changed=false" >> "$GITHUB_OUTPUT"
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Sync map data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@v5
        if: github.event_name != 'schedule' || steps.commit.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'schedule' || steps.commit.outputs.changed == 'true'
        with:
          path: .

  deploy:
    needs: sync
    if: github.event_name != 'schedule' || needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
